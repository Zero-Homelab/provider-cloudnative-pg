name: Publish CNPG PostGIS operand

on:
  push:
    branches: [main]
    paths:
      - images/cnpg-postgis/**
      - .github/workflows/publish-postgis.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zero-homelab/cnpg-postgis

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/cnpg-postgis
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:17.10-postgis
            ${{ env.IMAGE }}:17.10-postgis-${{ github.sha }}

      # CNPG runs this operand without a registry credential. The package contains
      # no runtime secrets; its source is linked to this public provider fork.
      - name: Make operand package pullable by CNPG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/cnpg-postgis" \
            -f visibility=public

      - name: Publish immutable digest
        run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
